[workspace]

[package]
name = "dsh-persona-installer"
version = "0.1.0"
description = "DSH 数字分身图形化安装向导"
edition = "2021"

# 独立二进制：和 app/ 下的 dsh-persona-app 互不依赖，独立维护、签发、发布。
# 与 DSH Desktop / setup.ps1 共享相同的 ~/.dsh、便携版 Node 路径，因此下游
# 安装流程仍然走 scripts/setup.{ps1,sh}；本进程只在前面挡一层向导壳。

[[bin]]
name = "dsh-persona-installer"
path = "src-tauri/src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1