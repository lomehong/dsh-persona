name: build-installer

# DSH 数字分身 GUI 安装向导：跨平台打包
# 产物：Windows nsis + macOS dmg + Linux deb/appimage
# 与 build-macos.yml 平行，互不依赖。

on:
  push:
    branches: [main]
    paths:
      - 'app/installer/**'
      - '.github/workflows/build-installer.yml'
  workflow_dispatch:

jobs:
  installer:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      # Linux 需要 WebKit2GTK 与若干 dev 库（Tauri 官方推荐）
      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev

      - name: 安装 Rust（与本地 1.93 对齐）
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/installer -> target

      - name: 安装 tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: 构建 Tauri 安装向导
        working-directory: app/installer/src-tauri
        run: |
          cargo tauri build --bundles ${{ matrix.os == 'windows-latest' && 'nsis' || matrix.os == 'macos-latest' && 'app,dmg' || 'deb,appimage' }}

      - name: 整理产物
        shell: bash
        run: |
          mkdir -p dist
          set -e
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp -v app/installer/src-tauri/target/release/bundle/nsis/*.exe dist/ || true
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp -R app/installer/src-tauri/target/release/bundle/macos/*.app dist/ || true
            cp -v app/installer/src-tauri/target/release/bundle/dmg/*.dmg dist/ || true
          else
            cp -v app/installer/src-tauri/target/release/bundle/deb/*.deb dist/ || true
            cp -v app/installer/src-tauri/target/release/bundle/appimage/*.AppImage dist/ || true
          fi
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-persona-installer-${{ matrix.os }}
          path: dist/
          if-no-files-found: warn