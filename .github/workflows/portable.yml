name: portable

# 数字分身便携包（U盘版）制作与发布
# - workflow_dispatch：手动制作（可指定版本），产物上传 Artifact
# - tag portable-v*：制作并附加到 GitHub Release 草稿
# 依赖 dsh-desktop 对应版本的 Release 已提供 DSH-Desktop_Portable_<v>_x64.zip

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: "DSH 运行时版本"
        default: "0.1.1-rc.2"
      desktop_version:
        description: "DSH Desktop 便携应用版本"
        default: "0.1.4"
      node_version:
        description: "便携 Node 版本"
        default: "24.19.0"
  push:
    tags: ["portable-v*"]

permissions:
  contents: write

jobs:
  make-portable:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本（tag 便携包跟随 tag 版本）
        shell: pwsh
        run: |
          $dsh = "${{ inputs.dsh_version }}"
          $desk = "${{ inputs.desktop_version }}"
          if ("${{ github.ref }}" -like "refs/tags/portable-v*") {
            if (-not $desk) { $desk = "${{ github.ref_name }}".Replace("portable-v", "") }
          }
          if (-not $dsh) { $dsh = "0.1.1-rc.2" }
          if (-not $desk) { $desk = "0.1.4" }
          "dsh_version=$dsh" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "desktop_version=$desk" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "node_version=${{ inputs.node_version }}" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: 运行 make-portable.ps1
        shell: powershell
        run: |
          # 动态构建参数：空值不传（空串会覆盖脚本内默认值）；$args 是自动变量不可用
          $mpArgs = @()
          if ($env:dsh_version) { $mpArgs += @("-DshVersion", $env:dsh_version) }
          if ($env:desktop_version) { $mpArgs += @("-DesktopVersion", $env:desktop_version) }
          if ($env:node_version) { $mpArgs += @("-NodeVersion", $env:node_version) }
          & .\scripts\make-portable.ps1 @mpArgs
          if (-not $?) { exit 1 }

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Persona-Portable-win-x64
          path: dist-portable/*.zip
          if-no-files-found: error

      - name: 附加到 Release（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/portable-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "DSH 数字分身便携版 ${{ github.ref_name }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          files: dist-portable/*.zip
